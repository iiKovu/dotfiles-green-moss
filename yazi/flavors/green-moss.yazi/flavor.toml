# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#f3ece4" }
# Find
find_keyword = { fg = "#c5cfae", italic = true }
find_position = { fg = "#c5cfae", bg = "reset", italic = true }
# Marker
marker_selected = { fg = "#a3b18a", bg = "#b8bdac" }
marker_copied = { fg = "#666b57", bg = "#a3b18a" }
marker_cut = { fg = "#d8c98f", bg = "#8fa8a6" }
# Border
border_symbol = "│"
border_style = { fg = "#7d8270" }

# : }}}

# : Tabs {{{

[tabs]
active = { fg = "#181a15", bg = "#b8bdac" }
inactive = { fg = "#f3ece4", bg = "#3a3f33" }

# : }}}

# : Mode {{{

[mode]
normal_main = { fg = "#10120e", bg = "#a3b18a", bold = true }
normal_alt = { fg = "#a3b18a", bg = "#3a3f33" }
select_main = { fg = "#10120e", bg = "#a3b18a", bold = true }
select_alt = { fg = "#a3b18a", bg = "#3a3f33" }
unset_main = { fg = "#10120e", bg = "#a3b18a", bold = true }
unset_alt = { fg = "#a3b18a", bg = "#3a3f33" }

# : }}}

# : Status bar {{{

[status]
# Permissions
perm_sep = { fg = "#7d8270" }
perm_type = { fg = "#f3ece4" }
perm_read = { fg = "#f3ece4" }
perm_write = { fg = "#7f9a5e" }
perm_exec = { fg = "#7f9a5e" }
# Progress
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#4a5243", bg = "#3a3f33" }
progress_error = { fg = "#d4888a", bg = "#3a3f33" }

# : }}}

# : Input {{{

[input]
border = { fg = "#f3ece4" }
title = {  }
value = {  }
selected = { reversed = true }

# : }}}

# : Pick {{{

[pick]
border = { fg = "#f3ece4" }
active = { fg = "#c5cfae" }
inactive = {  }

# : }}}

# : Completion {{{

[cmp]
border = { fg = "#f3ece4" }

# : }}}

# : Tasks {{{

[tasks]
border = { fg = "#f3ece4" }
title = {  }

# : }}}

# : Which {{{

[which]
mask = { bg = "#000000" }
cand = { fg = "#9fc0ad" }
rest = { fg = "#7d8270" }
desc = { fg = "#c5cfae" }
separator = "  "
separator_style = { fg = "#c5cfae" }

# : }}}

# : Help {{{

[help]
on = { fg = "#b8bdac" }
run = { fg = "#b8bdac" }
footer = { fg = "#10120e", bg = "#9fc0ad" }

# : }}}

# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#b8bdac" },
  # Videos
  { mime = "video/*", fg = "#b8bdac" },
  { mime = "audio/*", fg = "#b8bdac" },
  # Archives
  { mime = "application/zip", fg = "#c5cfae" },
  { mime = "application/gzip", fg = "#c5cfae" },
  { mime = "application/x-tar", fg = "#c5cfae" },
  { mime = "application/x-bzip", fg = "#c5cfae" },
  { mime = "application/x-bzip2", fg = "#c5cfae" },
  { mime = "application/x-7z-compressed", fg = "#c5cfae" },
  { mime = "application/x-rar", fg = "#c5cfae" },
  # Fallback
  { url = "*", fg = "#f3ece4" },
  { url = "*/", fg = "#a3b18a" },
]

# : }}}

[icon]
conds = [
  # Fallback
  { if = "dir", text = "", fg = "#a3b18a" },
  { if = "exec", text = "", fg = "#d8c98f" },
  { if = "!dir", text = "", fg = "#f3ece4" },
]
