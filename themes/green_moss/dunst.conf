# Loaded as a dunstrc.d drop-in, so it overrides the same keys in dunstrc.

[global]
frame_color = "#666b57"

[urgency_low]
background = "#181a15"
foreground = "#f3ece4"
frame_color = "#4a5243"
highlight = "#b8bdac"

[urgency_normal]
background = "#181a15"
foreground = "#f3ece4"
frame_color = "#666b57"
highlight = "#A3B18A"

[urgency_critical]
background = "#181a15"
foreground = "#f3ece4"
frame_color = "#D4888A"
highlight = "#D4888A"
