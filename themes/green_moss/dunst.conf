# Loaded as a dunstrc.d drop-in, so it overrides the same keys in dunstrc.

[global]
frame_color = "#6B705C"

[urgency_low]
background = "#1A1C16"
foreground = "#E5DCD0"
frame_color = "#262920"
highlight = "#B0A294"

[urgency_normal]
background = "#1A1C16"
foreground = "#E5DCD0"
frame_color = "#6B705C"
highlight = "#E5DCD0"

[urgency_critical]
background = "#1A1C16"
foreground = "#E5DCD0"
frame_color = "#C98D80"
highlight = "#C98D80"
