[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/themes/current/polybar.ini

[bar/base]
override-redirect = false
bottom = false
fixed-center = true

width = 100%
offset-x = 0
offset-y = 0

foreground = ${colors.foreground}

module-margin = 0

font-1 = "Noto Sans CJK JP:13;4"

separator =
spacing = 0

dim-value = 1.0

wm-name = bspwm
wm-restack = bspwm

cursor-click = pointer


[bar/top]
inherit = bar/base
monitor = ${env:MONITOR:DisplayPort-1}

height = 37
radius = 0

background = ${colors.background}

line-size = 2
line-color = ${colors.accent}

padding-right = 3
padding-left = 3

font-0 = "Iosevka:weight:bold:pixelsize=12;7"
font-2 = "Font Awesome 7 Free:pixelsize=12;7"
font-3 = "Liga SFMono Nerd Font:pixelsize=12;6"

modules-left   = pulseaudio sps cpu sps memory sps xkeyboard
modules-center = bspwm
modules-right  = title sps calendar sps date sps tray-toggle tray

dpi-x = 97
dpi-y = 97

enable-ipc = true

border-color = ${colors.background-alt}


[bar/second]
inherit = bar/base
monitor = ${env:MONITOR:DisplayPort-0}

index-sort = true

height = 31

background = ${colors.popup}

line-size = 2
line-color = ${colors.accent}

padding-right = 2
padding-left = 2

font-0 = "Iosevka:weight:bold:pixelsize=12;7"
font-2 = "Font Awesome 7 Free:pixelsize=12;7"
font-3 = "Liga SFMono Nerd Font:pixelsize=12;6"

modules-left   = pulseaudio sps title
modules-center = bspwm
modules-right  = date sps calendar

dpi-x = 97
dpi-y = 97

enable-ipc = false

border-color = ${colors.background-alt}


[bar/third]
inherit = bar/base
monitor = ${env:MONITOR:HDMI-A-0}

index-sort = true

height = 41

offset-y = 2

background = #000000ff

line-size = 1
line-color = #fff

padding-right = 3
padding-left = 3

font-0 = "Iosevka:weight:bold:pixelsize=12;7"
font-2 = "Font Awesome 7 Free:pixelsize=12;7"
font-3 = "Liga SFMono Nerd Font:pixelsize=12;6"

modules-left   = title sps pulseaudio
modules-center = bspwm
modules-right  = date

dpi-x = 100
dpi-y = 100

enable-ipc = false

border-color = ${colors.background}


[module/bspwm]
type = internal/bspwm

pin-workspaces = true
enable-click = true
enable-scroll = true

ws-icon-0 = 1;火
ws-icon-1 = 2;水
ws-icon-2 = 3;山
ws-icon-3 = 4;六
ws-icon-4 = 5;千
ws-icon-5 = 6;♛
ws-icon-6 = 7;♚
ws-icon-7 = 8;⏾
ws-icon-8 = 9;☀

format = <label-state><label-mode>

label-focused            = %{T2} %icon% %{T-}
label-focused-foreground = ${colors.foreground}
label-focused-underline  = ${colors.accent}

label-occupied            = %{T2} %icon% %{T-}
label-occupied-foreground = ${colors.foreground-dim}
label-occupied-underline  = ${colors.accent-muted}

label-urgent            = %{T2} %icon% %{T-}
label-urgent-foreground = ${colors.red}
label-urgent-underline  = ${colors.red}

label-empty            =
label-empty-foreground = ${colors.foreground-dim}

label-active-padding   = 1
label-focused-padding  = 1
label-occupied-padding = 1
label-urgent-padding   = 1
label-empty-padding    = 0


[module/date]
type = internal/date

interval = 30
time = "%H:%M"

format = <label>
format-prefix            = ""
format-prefix-foreground = ${colors.accent}

label            = %time%
label-foreground = ${colors.foreground}


[module/sps]
type = custom/text

format            = " · "
format-foreground = ${colors.sepcolor}


[module/pulseaudio]
type = internal/pulseaudio

interval = 1
use-ui-max = true

format-volume            = <label-volume>
format-volume-prefix     = "󰕾 "
format-volume-prefix-foreground = ${colors.foreground}

label-volume            = %percentage%%
label-volume-foreground = ${colors.foreground}

format-muted            = <label-muted>
format-muted-prefix     = "󰝟 "
format-muted-prefix-foreground = ${colors.foreground-dim}

label-muted            = MUTE
label-muted-foreground = ${colors.foreground-dim}

click-right = pwvucontrol &


[module/visualizer]
type = custom/script
exec = ~/.config/polybar/audio-visualizer.sh
tail = true
format = <label>
format-foreground = ${colors.foreground}
label = %output%


[module/battery]
type = internal/battery

full-at = 95

battery = BAT0
adapter = ADP1

poll-interval = 5

format-charging    = <label-charging>
format-discharging = <label-discharging>
format-full        = <label-full>

label-charging    = %percentage_raw%%
label-discharging = %percentage_raw%%
label-full        = 100%

label-charging-foreground    = ${colors.foreground}
label-discharging-foreground = ${colors.foreground}
label-full-foreground        = ${colors.foreground}

format-charging-prefix               = "󰂄 "
format-discharging-prefix            = "󰁹 "
format-full-prefix                   = "󰁹 "
format-charging-prefix-foreground    = ${colors.accent}
format-discharging-prefix-foreground = ${colors.accent}
format-full-prefix-foreground        = ${colors.accent}

pseudo-transparency = true


[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted            = %{F#EBE1D5}%{F-}%used% of %total%
label-unmounted            = %mountpoint% not mounted
label-unmounted-foreground = ${colors.foreground}


[module/memory]
type = internal/memory

interval = 3
warn-percentage = 95

format            = "%{A1:kitty -e htop:}󰻟 <label>%{A}"
format-foreground = ${colors.foreground}

format-warn            = "%{A1:kitty -e htop:}󰻟 <label-warn>%{A}"
format-warn-foreground = ${colors.red}

label              = %percentage_used%%
label-warn         = %percentage_used%%
label-warn-foreground = ${colors.red}
label-padding = 0

[module/cpu]
type = internal/cpu

interval = 2
warn-percentage = 95

format            = "%{A1:kitty -e htop:}󰍛 <label>%{A}"
format-foreground = ${colors.foreground}

format-warn            = "%{A1:kitty -e htop:}󰍛 <label-warn>%{A}"
format-warn-foreground = ${colors.red}

label              = %percentage%%
label-warn         = %percentage%%
label-warn-foreground = ${colors.red}
label-padding = 0

[module/powermenu]
type = custom/menu

expand-right = true
format-spacing = 1

label-open             = "PWR"
label-open-foreground  = ${colors.white}
label-close            = "PWR"
label-close-foreground = #742222
label-separator        = |
label-separator-foreground = ${colors.foreground}

menu-0-0      = "Shutdown"
menu-0-0-exec = poweroff
menu-0-1      = "Reboot"
menu-0-1-exec = reboot
menu-0-2      = "Log out"
menu-0-2-exec = bspc quit


[module/network]
type = internal/network
interface = enp8s0
interval = 3.0

format-connected            = <label-connected>
format-connected-prefix     = "⇆ "
format-connected-prefix-foreground = ${colors.accent}

label-connected        = %downspeed:7%
label-connected-maxlen = 25

format-disconnected            = <label-disconnected>
format-disconnected-prefix     = " "
format-disconnected-prefix-foreground = ${colors.red}
label-disconnected = %ifname%


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format        = <label-layout>
format-prefix = "󰌌  "
format-prefix-foreground = ${colors.foreground}

label-layout            = %name%
label-layout-foreground = ${colors.foreground}

label-indicator-padding    = 2
label-indicator-margin     = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.background}


[module/player]
type = custom/script
exec     = ~/.config/polybar/player.sh
interval = 10
click-left   = playerctl next &
click-right  = playerctl previous &
click-middle = playerctl play-pause &


[module/calendar]
type = custom/script
exec       = ~/.config/polybar/popup-calendar.sh
interval   = 60
click-left = ~/.config/polybar/popup-calendar.sh --popup &

format-prefix            = ""
format-prefix-foreground = ${colors.foreground}


[module/title]
type = internal/xwindow
format      = <label>
label       = %class%
label-empty = "⺋"
label-maxlen = 30


[module/tray-toggle]
type = custom/text
format = "󰀻 "
format-foreground = ${colors.foreground}
click-left = polybar-msg action "#tray.module_toggle" &


[module/tray]
type = internal/tray

hidden = true
tray-spacing = 2px
tray-padding = 2px
tray-size    = 70%:-5pt
