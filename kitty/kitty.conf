# Font

#font_family			JetBrains Mono Nerd Font
#font_family			Liga SFMono Nerd
#font_family			Maple Mono
font_family				JetBrainsMono Nerd Font Mono
bold_font				auto
italic_font				auto
bold_italic_font		auto
font_size 13

# Keybindings
map --allow-fallback=shifted,ascii ctrl+shift+j scroll_line_down smooth
map --allow-fallback=shifted,ascii ctrl+shift+k scroll_line_up smooth

map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab

map ctrl+shift+n next_window
map ctrl+shift+left move_window left
map ctrl+shift+right move_window right
map ctrl+shift+up move_window up
map ctrl+shift+down move_window down
#map ctrl+shift+h neighboring_window left
#map ctrl+shift+l neighboring_window right
#map ctrl+shift+k neighboring_window up
#map ctrl+shift+j neighboring_window down

map ctrl+shift+o next_layout

map ctrl+shift+0 restore_font_size

# Layout
adjust_column_width 1
enabled_layouts grid,splits:split_axis=vertical,fat,tall,horizontal,vertical

# Ligatures
disable_ligatures cursor

# Window closing
confirm_os_window_close 0

# Check interval 
update_check_interval 0

# Tab titles
tab_title_template "{index}: {title.split('/')[-1]}"

# Cursor
# cursor #f0f0f0
# cursor_text_color #f0f0f0
cursor_shape beam
cursor_beam_thickness 1.7
cursor_blink_interval 0.7
cursor_stop_blinking_after 10 


# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 10

# Input delay
input_delay 1

# Sync to monitor
sync_to_monitor no

# Bell
enable_audio_bell no

# Window configuration
remember_window_size		no
initial_window_width		80c
initial_window_height		30c
placement_strategy			center
window_margin_width			0
window_padding_width		0

# Appearance
url_style curly
background_opacity 0.80

# BEGIN_KITTY_THEME
# Colors: active preset (~/Documents/scripts/theme.sh)
include ${XDG_CONFIG_HOME}/themes/current/kitty.conf
# END_KITTY_THEME
