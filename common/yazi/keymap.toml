# Keep this file limited to local overrides so Yazi's default keymap can
# continue receiving upstream changes after updates.

# Goto overrides
[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Documents/Downloads"
desc = "Go ~/Documents/Downloads"

# Bookmarks
[[mgr.prepend_keymap]]
on = ["b", "a"]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = ["b", "j"]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = ["b", "d"]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = ["b", "D"]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on = ["'"]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark / previous directory"

# Zoom
[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out hovered file"
